elastic {
  # Authentication
  credentials {
    scheme = "http"
    scheme = ${?ELASTIC_SCHEME}

    host = "localhost"
    host = ${?ELASTIC_HOST}
    host = ${?ELASTIC_IP} # An alternative environment variable that uses the host's IP address to ensure backward compatibility.

    port = 9200
    port = ${?ELASTIC_PORT}

    # No default: absent unless ELASTIC_AUTH_METHOD is set, so ElasticCredentials
    # auto-detects the method from the supplied credentials (basic / api-key / bearer).
    method = ${?ELASTIC_AUTH_METHOD}

    username = ""
    username = ${?ELASTIC_CREDENTIALS_USERNAME}

    password = ""
    password = ${?ELASTIC_CREDENTIALS_PASSWORD}

    api-key = ""
    api-key = ${?ELASTIC_CREDENTIALS_API_KEY}

    bearer-token = ""
    bearer-token = ${?ELASTIC_CREDENTIALS_BEARER_TOKEN}

  }

  # Performance
  multithreaded     = true
  connection-timeout = 5s
  socket-timeout     = 30s

  # Paged row extraction (scroll / PIT + search_after)
  scroll {
    # Rows per page. Larger pages cut round-trips linearly and raise in-flight memory linearly.
    size = 1000
    size = ${?ELASTIC_SCROLL_SIZE}
    # Ceiling on concurrent PIT slices for a no-ORDER-BY extraction (ES 7.15+). The effective
    # count is min(primary shards, max-slices); 1 disables slicing (sequential paging).
    max-slices = 8
    max-slices = ${?ELASTIC_SCROLL_MAX_SLICES}
  }

  # When enabled, result rows surface the Elasticsearch document id as an `_id` column.
  # Disabled by default: SQL results carry only the selected columns.
  include-document-id = false
  include-document-id = ${?ELASTIC_INCLUDE_DOCUMENT_ID}

  # Cluster discovery
  discovery {
    enabled = false
    frequency = 5m
  }

  # Metrics and Monitoring
  metrics {
    enabled = true
    monitoring {
      enabled = true
      interval = 30s
      failure-rate-threshold = 10.0  # Alert if > 10% failures
      latency-threshold = 1000.0     # Alert if average latency > 1000ms
    }
  }

  # Watcher targets the main cluster by default: every key INHERITS the resolved
  # elastic.credentials value via a real HOCON substitution (issue #172 - these used
  # to be literal strings like "elastic.credentials.api-key", which never inherited
  # anything and tripped auth auto-detection into ApiKeyAuth). A per-key
  # ELASTIC_WATCHER_* env var overrides the inherited value.
  watcher {
    scheme = ${elastic.credentials.scheme}
    scheme = ${?ELASTIC_WATCHER_SCHEME}

    host = ${elastic.credentials.host}
    host = ${?ELASTIC_WATCHER_HOST}

    port = ${elastic.credentials.port}
    port = ${?ELASTIC_WATCHER_PORT}

    # Optional substitution: elastic.credentials.method is ABSENT unless
    # ELASTIC_AUTH_METHOD is set (auth auto-detection design) - a required
    # substitution would fail resolution.
    method = ${?elastic.credentials.method}
    method = ${?ELASTIC_WATCHER_AUTH_METHOD}

    username = ${elastic.credentials.username}
    username = ${?ELASTIC_WATCHER_USERNAME}

    password = ${elastic.credentials.password}
    password = ${?ELASTIC_WATCHER_PASSWORD}

    api-key = ${elastic.credentials.api-key}
    api-key = ${?ELASTIC_WATCHER_API_KEY}

    bearer-token = ${elastic.credentials.bearer-token}
    bearer-token = ${?ELASTIC_WATCHER_BEARER_TOKEN}
  }
}