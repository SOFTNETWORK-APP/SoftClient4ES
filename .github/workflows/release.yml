# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release
# Run workflow on commits to the `main` branch
on:
  workflow_dispatch:
    inputs:
      snapshot_jars:
        description: 'SNAPSHOT version: also publish the REPL jars to the cli-snapshot pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

# One release run at a time: a tag push and a manual dispatch of the same version must not race
# for the GitHub release
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
#    runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
    - name: Env
      run: |
        echo "JFROG_USER=${{ secrets.JFROG_USER }}" >>  $GITHUB_ENV
        echo "JFROG_PASSWORD=${{ secrets.JFROG_PASSWORD }}" >>  $GITHUB_ENV
        echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >>  $GITHUB_ENV
        echo "CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }}" >>  $GITHUB_ENV
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
#        cache: 'sbt'
    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1
    - name: Formatting
      run: sbt scalafmtSbtCheck scalafmtCheck test:scalafmtCheck
    - name: Set vm.max_map_count
      run: sudo sysctl -w vm.max_map_count=262144
    - name: Run tests & Coverage Report
      run: SBT_OPTS="-Xss4M -Xms1g -Xmx4g -Dfile.encoding=UTF-8" sbt compile coverage test coverageReport coverageAggregate
    - name: log4j closure guard
      run: SBT_OPTS="-Xss4M -Xms1g -Xmx4g -Dfile.encoding=UTF-8" sbt checkLog4j
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: sql/target/scala-2.13/coverage-report/cobertura.xml,core/target/scala-2.13/coverage-report/cobertura.xml,persistence/target/scala-2.13/coverage-report/cobertura.xml,es6/sql-bridge/target/scala-2.13/coverage-report/cobertura.xml,es6/jest/target/scala-2.13/coverage-report/cobertura.xml,es6/rest/target/scala-2.13/coverage-report/cobertura.xml,es6/teskit/target/scala-2.13/coverage-report/cobertura.xml,es7/sql/bridge/target/scala-2.13/coverage-report/cobertura.xml,es7/rest/target/scala-2.13/coverage-report/cobertura.xml,es7/core/teskit/target/scala-2.13/coverage-report/cobertura.xml,es8/sql/bridge/target/scala-2.13/coverage-report/cobertura.xml,es8/java/target/scala-2.13/coverage-report/cobertura.xml,es8/core/teskit/target/scala-2.13/coverage-report/cobertura.xml,es9/sql/bridge/target/scala-2.13/coverage-report/cobertura.xml,es9/java/target/scala-2.13/coverage-report/cobertura.xml,es9/core/teskit/target/scala-2.13/coverage-report/cobertura.xml
        flags: unittests
        fail_ci_if_error: false
        verbose: true
    - name: Publish
      run: SBT_OPTS="-Xss4M -Xms1g -Xmx4g -Dfile.encoding=UTF-8" SCALACTIC_FILL_FILE_PATHNAMES=yes sbt '+ publish'
    # The REPL jars are downloads, not dependencies: they go to GitHub Releases on
    # SOFTNETWORK-APP/softclient4es-releases, never to JFrog. A release version always publishes
    # them; a SNAPSHOT version only when `snapshot_jars` is checked, into the cli-snapshot
    # pre-release. RELEASES_TOKEN: contents:write on softclient4es-releases.
    - name: Version
      run: echo "VERSION=$(sed -nE 's/^ThisBuild \/ version := "([^"]+)".*/\1/p' build.sbt)" >> $GITHUB_ENV
    - name: Assemble the REPL jars
      if: ${{ !endsWith(env.VERSION, '-SNAPSHOT') || inputs.snapshot_jars }}
      run: SBT_OPTS="-Xss4M -Xms1g -Xmx4g -Dfile.encoding=UTF-8" sbt es6cli/assembly es7cli/assembly es8cli/assembly es9cli/assembly
    - name: Checkout the release publisher
      if: ${{ !endsWith(env.VERSION, '-SNAPSHOT') || inputs.snapshot_jars }}
      uses: actions/checkout@v4
      with:
        repository: SOFTNETWORK-APP/softclient4es-releases
        # a reviewed commit, bumped deliberately: this script runs with RELEASES_TOKEN
        ref: 6a5eac858eadc2ee88adfca373632ae7b39e3314
        path: .softclient4es-releases
    - name: Publish the REPL jars to GitHub Releases
      if: ${{ !endsWith(env.VERSION, '-SNAPSHOT') || inputs.snapshot_jars }}
      env:
        GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      run: |
        mode=release
        [[ "$VERSION" == *-SNAPSHOT ]] && mode=snapshot
        # the external publisher never sees the job's other credentials
        unset JFROG_USER JFROG_PASSWORD GITHUB_TOKEN CODECOV_TOKEN
        bash .softclient4es-releases/scripts/publish.sh "$mode" cli "$VERSION" \
          es*/cli/target/scala-2.13/softclient4es*-cli-"$VERSION"-assembly.jar
